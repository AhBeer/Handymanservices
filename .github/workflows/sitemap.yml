yamlname: Generate Sitemap

on:
  push:
    branches:
      - main  # Change this if your default branch is 'master'

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate a sitemap
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Important: fetch-depth 0 is required for accurate Git commit history dates

    - name: Generate Sitemap
      id: sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: https://www.handy-man.com.sg

    - name: Commit and Push Sitemap Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sitemap.xml
        # Only commit if the sitemap actually changed to avoid workflow loops
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated sitemap update"
        git push
